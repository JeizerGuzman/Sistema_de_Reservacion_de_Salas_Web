{% extends "base.html" %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="bg-white border border-slate-200 shadow-xl rounded-2xl max-w-md w-full p-8 space-y-6">
        <div class="text-center space-y-1">
            <div class="inline-flex p-3 bg-slate-900 text-white rounded-xl mb-2">
                <i data-lucide="lock" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Iniciar Sesión</h2>
            <p class="text-xs text-slate-500">Ingresa tus credenciales institucionales</p>
        </div>

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Correo Electrónico</label>
                <input type="email" name="correo" required placeholder="tu_correo@ittg.edu.mx" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <button type="submit" class="w-full py-2.5 bg-[#0f172a] hover:bg-slate-800 text-white font-bold rounded-lg text-sm shadow transition-colors flex items-center justify-center space-x-2">
                <span>Ingresar al Sistema</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="text-center pt-4 border-t border-slate-100 text-xs text-slate-500">
            ¿No tienes cuenta? <a href="/registro" class="text-blue-700 font-bold hover:underline">Regístrate aquí</a>
        </div>
        
        <div class="p-3 bg-slate-50 rounded-lg text-[11px] text-slate-500 text-center">
            <strong>Admin por defecto:</strong> admin@ittg.edu.mx / admin123
        </div>
    </div>
</div>
{% endblock %}
