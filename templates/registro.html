{% extends "base.html" %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="bg-white border border-slate-200 shadow-xl rounded-2xl max-w-md w-full p-8 space-y-6">
        <div class="text-center space-y-1">
            <div class="inline-flex p-3 bg-blue-900 text-white rounded-xl mb-2">
                <i data-lucide="user-plus" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Registro de Usuario</h2>
            <p class="text-xs text-slate-500">Crea tu cuenta asignada a tu departamento</p>
        </div>

        <form method="POST" action="/registro" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre Completo *</label>
                <input type="text" name="nombre" required placeholder="Ej. Ing. Carlos Vázquez" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Correo Electrónico *</label>
                <input type="email" name="correo" required placeholder="carlos.vazquez@ittg.edu.mx" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Área Académica / Departamento *</label>
                <select name="id_area" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    <option value="">-- Seleccionar Área --</option>
                    {% for a in areas %}
                        <option value="{{ a.id_area }}">{{ a.nombre_area }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contraseña *</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Confirmar *</label>
                    <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 bg-[#0f172a] hover:bg-slate-800 text-white font-bold rounded-lg text-sm shadow transition-colors flex items-center justify-center space-x-2">
                <i data-lucide="check" class="w-4 h-4"></i>
                <span>Crear Cuenta</span>
            </button>
        </form>

        <div class="text-center pt-4 border-t border-slate-100 text-xs text-slate-500">
            ¿Ya tienes cuenta? <a href="/login" class="text-blue-700 font-bold hover:underline">Inicia sesión</a>
        </div>
    </div>
</div>
{% endblock %}
